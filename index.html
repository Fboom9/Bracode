<!DOCTYPE html>
<html>
<head>
  <title>Face CRM</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <style>
    body { margin:0; background:#0a0a0a; color:#0f0; font-family:monospace; display:flex; height:100vh; overflow:hidden; }
    #cam { position:relative; width:60%; height:100%; }
    #video { width:100%; height:100%; object-fit:cover; }
    #canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
    #chat { width:40%; padding:20px; display:flex; flex-direction:column; background:#111; border-left:2px solid #0f0; }
    #log { flex:1; overflow-y:auto; margin-bottom:10px; }
    .msg { padding:8px; margin:4px 0; border-bottom:1px solid #222; }
    .user { color:#0ff; }
    .bot { color:#0f0; }
    #input-area { display:flex; gap:10px; }
    #input { flex:1; background:#222; border:1px solid #0f0; color:#fff; padding:10px; }
    #mic { background:#0f0; color:#000; border:none; padding:10px; cursor:pointer; border-radius:4px; }
    #speak-btn { background:#00f; color:#fff; border:none; padding:10px; cursor:pointer; border-radius:4px; }
    .status { font-size:12px; color:#555; }
  </style>
</head>
<body>

<div id="cam">
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<div id="chat">
  <h2>🌀 AI Clerk</h2>
  <div id="log"><div class="bot msg">Ready. Say "add sale" or "get last".</div></div>
  <div id="input-area">
    <input id="input" placeholder="Type command...">
    <button id="mic">🎤 Speak</button>
    <button id="speak-btn">🔊 Echo</button>
  </div>
  <div class="status" id="status">Face detection: loading...</div>
</div>

<script>
// --- CONFIG ---
const SCRIPT_URL = "YOUR_APPS_SCRIPT_URL_HERE"; // PASTE YOUR DEPLOYED URL

// --- DOM ---
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const logDiv = document.getElementById('log');
const input = document.getElementById('input');
const micBtn = document.getElementById('mic');
const speakBtn = document.getElementById('speak-btn');
const statusDiv = document.getElementById('status');

// --- SPEECH ---
function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function listen() {
  const r = new webkitSpeechRecognition();
  r.lang = 'en-US';
  r.onresult = (e) => {
    const q = e.results[0][0].transcript;
    input.value = q;
    handleCommand(q);
  };
  r.start();
}

// --- UI LOG ---
function addLog(text, cls = 'bot') {
  const d = document.createElement('div');
  d.className = `msg ${cls}`;
  d.textContent = text;
  logDiv.appendChild(d);
  logDiv.scrollTop = logDiv.scrollHeight;
}

// --- BACKEND CALL ---
async function callSheet(action, item = '', value = '') {
  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action, item, value }),
      headers: { 'Content-Type': 'application/json' }
    });
    return await res.json();
  } catch (e) {
    return { status: 'error', msg: e.message };
  }
}

// --- COMMAND PARSER ---
async function handleCommand(raw) {
  const txt = raw.toLowerCase().trim();
  addLog(`You: ${raw}`, 'user');

  if (txt.startsWith('add sale')) {
    const parts = raw.split(' ').slice(2); // assumes "add sale item value"
    if (parts.length < 2) {
      const reply = "Need item name and value.";
      addLog(reply);
      speak(reply);
      return;
    }
    const item = parts.slice(0, -1).join(' ');
    const value = parts[parts.length - 1];
    const res = await callSheet('add', item, value);
    const reply = res.status === 'saved' ? `Saved ${item} for ${value}` : `Error: ${res.msg}`;
    addLog(reply);
    speak(reply);
    return;
  }

  if (txt === 'get last') {
    const res = await callSheet('get');
    if (res.status === 'ok') {
      const reply = `Last entry: ${res.data[1]} at ${res.data[2] || 'N/A'}`;
      addLog(reply);
      speak(reply);
    } else {
      addLog('No data or error.');
    }
    return;
  }

  const reply = "Say 'add sale [item] [price]' or 'get last'.";
  addLog(reply);
  speak(reply);
}

// --- FACE DETECTION (MediaPipe) ---
function initFace() {
  const faceDetection = new FaceDetection({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
  });

  faceDetection.setOptions({
    model: 'short',
    minDetectionConfidence: 0.5
  });

  faceDetection.onResults((results) => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    if (results.detections.length > 0) {
      statusDiv.innerText = '✅ Face detected!';
      for (const det of results.detections) {
        const bbox = det.boundingBox;
        const x = bbox.xMin * canvas.width;
        const y = bbox.yMin * canvas.height;
        const w = (bbox.xMax - bbox.xMin) * canvas.width;
        const h = (bbox.yMax - bbox.yMin) * canvas.height;

        // Neon bounding box
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#0f0';
        ctx.shadowBlur = 10;
        ctx.strokeRect(x, y, w, h);

        // Fun "customer glasses" (two circles)
        const cx = x + w/2;
        const cy = y + h/3;
        const eyeR = w * 0.15;
        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#ff00ff';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(cx - eyeR*1.8, cy, eyeR, 0, 2*Math.PI);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx + eyeR*1.8, cy, eyeR, 0, 2*Math.PI);
        ctx.stroke();
        // bridge
        ctx.beginPath();
        ctx.moveTo(cx - eyeR*0.8, cy);
        ctx.lineTo(cx + eyeR*0.8, cy);
        ctx.stroke();
      }
    } else {
      statusDiv.innerText = '👤 No face. Look at camera.';
    }
  });

  const camera = new Camera(video, {
    onFrame: async () => { await faceDetection.send({ image: video }); },
    width: 640,
    height: 480
  });
  camera.start();
}

// --- EVENTS ---
micBtn.onclick = listen;
speakBtn.onclick = () => speak('System ready.');
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleCommand(input.value);
});

// --- INIT ---
initFace();
</script>
</body>
</html>
