<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production Order</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#16181d;--muted:#6b7280;--line:#e3e6eb;--accent:#0f766e;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1114;--card:#1a1d22;--text:#eef0f3;--muted:#98a0ab;--line:#2a2f36;--accent:#2dd4bf;--accent-t:#06201d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:120px}
header{padding:20px 16px 8px;max-width:640px;margin:auto}
h1{font-size:22px;margin:0}
main{max-width:640px;margin:auto;padding:0 16px}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
select,input[type=text],textarea{width:100%;padding:12px;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:16px}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);gap:8px}
.row:last-child{border:0}
.name{flex:1;font-weight:500}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:22px;line-height:1}
.step input{width:56px;height:40px;text-align:center;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px}
.row.on .name{color:var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:640px;margin:auto;display:flex;gap:8px;align-items:center}
.bar span{flex:1;font-size:14px;color:var(--muted)}
.btn{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-weight:600}
.btn.p{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn:disabled{opacity:.4}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;margin:12px 0}
</style>
</head>
<body>
<header><h1>Production Order</h1></header>
<main>
  <label class="f" for="dist">Order for (distributor)</label>
  <select id="dist"></select>
  <div class="list" id="list"></div>
  <label class="f" for="note">Notes (optional)</label>
  <textarea id="note" rows="2"></textarea>
  <button class="link" id="reset">Clear quantities</button>
</main>
<div class="bar"><div>
  <span id="total">0 items</span>
  <button class="btn" id="copy" disabled>Copy</button>
  <button class="btn p" id="send" disabled>Send</button>
</div></div>

<script>
/* ====== EDIT THIS SECTION ====== */
const PRODUCTS = [
  "Product 1","Product 2","Product 3","Product 4","Product 5","Product 6","Product 7",
  "Product 8","Product 9","Product 10","Product 11","Product 12","Product 13"
];
const DISTRIBUTORS = ["Distributor A","Distributor B","Distributor C"];
// Production WhatsApp number, international format, digits only (e.g. 962791234567). Leave "" to pick a contact when sending.
const WHATSAPP = "";
/* =============================== */

const qty = PRODUCTS.map(() => 0);
const $ = id => document.getElementById(id);
const dist = $("dist"), list = $("list");

dist.innerHTML = DISTRIBUTORS.map(d => `<option>${d}</option>`).join("");
try { const s = localStorage.getItem("dist"); if (s && DISTRIBUTORS.includes(s)) dist.value = s; } catch (e) {}
dist.onchange = () => { try { localStorage.setItem("dist", dist.value); } catch (e) {} };

PRODUCTS.forEach((p, i) => {
  const r = document.createElement("div");
  r.className = "row";
  r.innerHTML = `<div class="name"></div><div class="step"><button type="button" aria-label="minus">−</button><input type="number" inputmode="numeric" min="0" value="0"><button type="button" aria-label="plus">+</button></div>`;
  r.querySelector(".name").textContent = p;
  const [m, inp, pl] = [r.querySelectorAll("button")[0], r.querySelector("input"), r.querySelectorAll("button")[1]];
  const set = v => { qty[i] = Math.max(0, parseInt(v) || 0); inp.value = qty[i]; r.classList.toggle("on", qty[i] > 0); update(); };
  m.onclick = () => set(qty[i] - 1);
  pl.onclick = () => set(qty[i] + 1);
  inp.oninput = () => set(inp.value);
  r._set = set;
  list.appendChild(r);
});

function summary() {
  const lines = PRODUCTS.map((p, i) => qty[i] > 0 ? `• ${p}: ${qty[i]}` : null).filter(Boolean);
  const d = new Date().toLocaleDateString("en-GB");
  const note = $("note").value.trim();
  return `*Order for: ${dist.value}*\nDate: ${d}\n\n${lines.join("\n")}\n\nTotal: ${qty.reduce((a, b) => a + b, 0)}` + (note ? `\nNotes: ${note}` : "");
}

function update() {
  const t = qty.reduce((a, b) => a + b, 0), n = qty.filter(q => q > 0).length;
  $("total").textContent = `${n} products · ${t} units`;
  $("copy").disabled = $("send").disabled = t === 0;
}

$("send").onclick = () => {
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(summary())}`, "_blank");
};
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(summary()); $("copy").textContent = "Copied"; }
  catch (e) { prompt("Copy the order:", summary()); }
  setTimeout(() => $("copy").textContent = "Copy", 1500);
};
$("reset").onclick = () => { [...list.children].forEach(r => r._set(0)); $("note").value = ""; };
update();
</script>
</body>
</html>
